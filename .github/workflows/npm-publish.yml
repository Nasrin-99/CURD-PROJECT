name: Node.js CI & NPM Publish

on:
  push:
    branches:
      - main
      - master
      - new-root
  pull_request:
    branches:
      - main
      - master
      - new-root

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test || echo "No tests yet"
